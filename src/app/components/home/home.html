@if (auth.user(); as user) {
  <h1>Panel de Administración</h1>
  <p class="muted">Sesión iniciada como <strong>{{ user.name }}</strong> ({{ user.email }}) · Rol: {{ user.role }}</p>

  <p>Selecciona un módulo para gestionar la plataforma:</p>
  <div class="form-actions">
    <a class="button" routerLink="/users">Gestionar Usuarios</a>
    <a class="button" routerLink="/activities">Gestionar Actividades</a>
    <a class="button" routerLink="/reports">Revisar Reportes</a>
    <a class="button secondary" routerLink="/chat">Chat</a>
  </div>
}
